# =============================================================================
# pr.yml — Tuji iOS  (PR 檢查)
# 觸發：PR 開啟 / 更新時
# 跑：SwiftLint + SwiftFormat lint + Build + Unit Test
# 目標：< 8 分鐘
# =============================================================================

name: PR

on:
  pull_request:
    branches: [main, develop]

concurrency:
  # 同個 PR 連推會取消前一次
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    timeout-minutes: 5
    env:
      # 釘版：brew install 抓 latest，工具一升版規則就變、CI 就無預警轉紅
      # （0.61 的 indent/docComments 曾讓 main 紅了一段時間）。要升版時
      # 改這裡 + 本地跑一次 `swiftformat Tuji TujiTests` 同一個 PR 進。
      SWIFTFORMAT_VERSION: 0.61.1
      SWIFTLINT_VERSION: 0.64.0
    steps:
      - uses: actions/checkout@v7

      - name: Install SwiftLint & SwiftFormat (pinned)
        run: |
          mkdir -p "$HOME/.lint-tools"
          curl -fsSL -o /tmp/swiftformat.zip \
            "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip"
          unzip -o -q /tmp/swiftformat.zip -d /tmp/swiftformat-dist
          install -m 755 "$(find /tmp/swiftformat-dist -name swiftformat -type f | head -1)" "$HOME/.lint-tools/"
          curl -fsSL -o /tmp/swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -o -q /tmp/swiftlint.zip -d /tmp/swiftlint-dist
          install -m 755 "$(find /tmp/swiftlint-dist -name swiftlint -type f | head -1)" "$HOME/.lint-tools/"
          echo "$HOME/.lint-tools" >> "$GITHUB_PATH"
          "$HOME/.lint-tools/swiftformat" --version
          "$HOME/.lint-tools/swiftlint" version

      - name: SwiftFormat (lint mode)
        run: swiftformat . --lint

      - name: SwiftLint
        # Not --strict yet: W2 has many hard-coded Chinese strings the
        # no_hardcoded_chinese rule warns about. Errors still fail CI.
        run: swiftlint --reporter github-actions-logging

  release-build:
    name: Release build
    runs-on: macos-15
    timeout-minutes: 25
    # 自己一個 job，不是塞進 Build & Test：那個 job 本來就貼著 timeout 在跑，
    # 第一次嘗試把這一步加進去，整條在 21 分 25 秒被 20 分鐘的 timeout 砍掉。
    # 它問的也是不同的問題——不是「行為對嗎」，是「出得了版本嗎」。
    #
    # 只有 Debug 綠不代表能出版本。Debug 是 -Onone、逐檔編譯；TestFlight 是
    # -O -whole-module-optimization，而 MainActor 隔離錯誤與 SIL 最佳化階段的
    # 問題只在後者才會出現。2026-08-19 三個 PR 各自 CI 全綠地合進 main，而
    # main 當時已經無法產生 release binary：一個 DEBUG-only 型別被 #Preview
    # 參照（#Preview 在 release 也會編譯）、一個 nonisolated 情境呼叫了被推導成
    # MainActor 的靜態方法、以及一個泛型 class 的 deinit 讓 Swift 6.3.3 的
    # EarlyPerfInliner 直接崩潰（沒有任何 error: 行，只有 stack dump）。
    steps:
      - uses: actions/checkout@v7

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Cache SPM
        uses: actions/cache@v5
        with:
          path: |
            .build
            .swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Create stub Secrets.xcconfig
        run: |
          cat > Config/Secrets.xcconfig <<EOF
          TUJI_DEV_TEAM = STUBSTUBST
          TUJI_SUPABASE_PROJECT_DEV = stub-dev
          TUJI_SUPABASE_PROJECT_PROD = stub-prod
          TUJI_SUPABASE_ANON_KEY_DEV = stub
          TUJI_SUPABASE_ANON_KEY_PROD = stub
          TUJI_GOOGLE_CLIENT_ID = stub
          TUJI_GOOGLE_REVERSED_CLIENT_ID = com.googleusercontent.apps.stub
          EOF

      # 不跑測試，只編譯。
      - name: Build TestFlight configuration
        run: |
          set -o pipefail
          xcodebuild build \
            -project Tuji.xcodeproj \
            -scheme Tuji-TestFlight \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-release \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

  build-test:
    name: Build & Test
    runs-on: macos-15
    timeout-minutes: 20
    # 刻意不設 needs: lint — 之前 Lint 紅了整條測試就被跳過，
    # style 問題不該擋正確性檢查。
    steps:
      - uses: actions/checkout@v7

      - name: Setup Xcode (latest stable)
        # Nuke 13.0.6 uses `isolated deinit` (Swift 6.1+) so anything older
        # than Xcode 16.5 / 26 fails to build it. latest-stable resolves to
        # whatever the runner image has shipping — currently Xcode 26 on
        # macos-15.
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show versions
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SPM
        uses: actions/cache@v5
        with:
          path: |
            .build
            .swiftpm
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-

      - name: Create stub Secrets.xcconfig
        # PR job 不簽章，用空 Secrets 讓 build 跑得起來
        run: |
          cat > Config/Secrets.xcconfig <<EOF
          TUJI_DEV_TEAM = STUBSTUBST
          TUJI_SUPABASE_PROJECT_DEV = stub-dev
          TUJI_SUPABASE_PROJECT_PROD = stub-prod
          TUJI_SUPABASE_ANON_KEY_DEV = stub
          TUJI_SUPABASE_ANON_KEY_PROD = stub
          TUJI_GOOGLE_CLIENT_ID = stub
          TUJI_GOOGLE_REVERSED_CLIENT_ID = com.googleusercontent.apps.stub
          EOF

      - name: Resolve dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Tuji.xcodeproj \
            -scheme Tuji-Debug

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project Tuji.xcodeproj \
            -scheme Tuji-Debug \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions

      - name: Select simulator
        # runner image 的機型/OS 會隨 Xcode 版本變，寫死機名容易斷 —
        # 挑最新 iOS runtime 裡第一台可用 iPhone。
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          def rt_key(rt):
              tail = rt.rsplit("iOS-", 1)
              return [int(x) for x in tail[1].split("-")] if len(tail) == 2 else [-1]
          for rt in sorted((r for r in data if "iOS" in r), key=rt_key, reverse=True):
              iphones = [d for d in data[rt] if d["name"].startswith("iPhone")]
              if iphones:
                  print(iphones[0]["udid"]); break
          ')
          [ -n "$UDID" ] || { echo "::error::找不到可用的 iPhone simulator"; exit 1; }
          xcrun simctl list devices available | grep "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: |
          set -o pipefail
          xcodebuild test-without-building \
            -project Tuji.xcodeproj \
            -scheme Tuji-Debug \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/xcodebuild-test.log" \
            | xcbeautify --renderer github-actions

      - name: Assert every test actually ran
        # 一次崩潰不會讓這個 job 變紅：xcodebuild 照樣印 ✔，**只有測試總數變小**。
        # 而 xcbeautify 恰好把 Swift Testing 自己那行總結吃掉了，所以綠勾底下少了
        # 十幾個測試這件事，在 CI 的輸出裡是看不見的（實測每次執行掉的 suite 還不
        # 一樣）。所以對帳要看 tee 出來的**原始**輸出，而不是印在畫面上的那份。
        #
        # 門檻不是寫死的數字，是原始碼裡 @Test 的數量——參數化測試會展開成多個
        # case，所以只要求「跑到的不少於宣告的」。隔壁 tuji-web 的 CI 早就有這道
        # 關卡，而有「崩潰會偽裝成綠勾」這條記錄的是這一邊。
        run: |
          log="$RUNNER_TEMP/xcodebuild-test.log"
          if grep -q "Restarting after unexpected exit" "$log"; then
            echo "::error::a test process crashed mid-run; xcodebuild still reports success when that happens"
            grep -n "Restarting after unexpected exit" "$log" | head -5
            exit 1
          fi
          ran=$(grep -oE "Test run with [0-9]+ tests" "$log" | grep -oE "[0-9]+" | tail -1)
          declared=$(grep -rhoE '^[[:space:]]*@Test' TujiTests | wc -l | tr -d ' ')
          echo "reported by the runner: ${ran:-none}   declared in TujiTests: $declared"
          if [ -z "$ran" ]; then
            echo "::error::no Swift Testing summary in the raw log — the run produced no test output at all"
            exit 1
          fi
          if [ "$ran" -lt "$declared" ]; then
            echo "::error::$ran tests ran but $declared are declared — a suite was dropped"
            exit 1
          fi

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: build/Logs/Test/*.xcresult

  api-contract:
    name: API contract check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          # 預設 fetch-depth: 1 的 checkout 裡沒有 origin/<base>，下面的
          # `git diff base...HEAD` 會直接 fatal，整個檢查等於沒跑。
          fetch-depth: 0

      - name: Check localization coverage
        # 介面字串與字表是兩次無關的編輯,而漏掉的那次只有在非中文介面下才看得出來
        # ——編譯過、測試過、CI 綠。這一步就是那條接縫。
        run: python3 scripts/check-localization.py

      - name: Check 詞塊 hosts
        # `.glossCard()` 漏掉時例句只是安靜地退回純文字——看起來跟「這個畫面沒有
        # 這個功能」一模一樣，所以沒有人會回報。已經漏過兩次。
        run: python3 scripts/check-gloss-host.py

      - name: Check launch assets
        # 原生 Launch Screen 不會被 unit tests 渲染；在 Linux 直接釘住
        # Info.plist、品牌底色與 1x/2x/3x 的像素契約。
        run: python3 scripts/check-launch-assets.py

      - name: Check ARCHITECTURE links
        # 提醒：若 PR 改了 Endpoint enum / Models.swift，描述要連結 backend PR。
        # PR body 透過 env 傳入（不要內插進 script，否則描述裡的反引號/括號會被當成 shell）。
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -E "Core/Networking/Endpoint\.swift|Models/.*\.swift" >/dev/null; then
            if ! printf '%s' "$PR_BODY" \
              | grep -E "(tuji#[0-9]+|Backend PR:)" >/dev/null; then
              echo "::warning::Endpoint/Models 有改但 PR 沒連 backend PR — 確認後端是否已配套部署？"
            fi
          fi
